version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: qfte
      POSTGRES_PASSWORD: qftepass
      POSTGRES_DB: qfte
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://qfte:qftepass@db:5432/qfte
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
